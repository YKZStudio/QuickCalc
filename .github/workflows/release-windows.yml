name: Build Windows Installers

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows ${{ matrix.arch }} installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Restore Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          QUICKCALC_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) {
            throw "Repository secret WINDOWS_CERTIFICATE_PFX_BASE64 is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:QUICKCALC_CERT_PASSWORD)) {
            throw "Repository secret WINDOWS_CERTIFICATE_PASSWORD is missing."
          }
          $certificateDirectory = Join-Path $env:GITHUB_WORKSPACE "cert"
          New-Item -ItemType Directory -Force -Path $certificateDirectory | Out-Null
          $certificatePath = Join-Path $certificateDirectory "cert.pfx"
          try {
            $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          } catch {
            throw "WINDOWS_CERTIFICATE_PFX_BASE64 is not valid Base64."
          }
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

      - name: Build signed installers
        shell: pwsh
        env:
          QUICKCALC_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          QUICKCALC_TIMESTAMP_URLS: https://timestamp.digicert.com;https://timestamp.sectigo.com
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis,msi

      - name: Show signing diagnostics
        if: always()
        shell: pwsh
        run: |
          $diagnosticPath = Join-Path $env:GITHUB_WORKSPACE "cert\signing.log"
          if (Test-Path -LiteralPath $diagnosticPath -PathType Leaf) {
            Get-Content -LiteralPath $diagnosticPath
          } else {
            Write-Host "No signing diagnostic file was produced."
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: QuickCalc_windows_${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "cert\cert.pfx") -Force -ErrorAction SilentlyContinue

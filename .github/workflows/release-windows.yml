name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Windows ${{ matrix.arch }} installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release tag and versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:check

      - name: Run frontend tests
        run: npm test

      - name: Restore Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          QUICKCALC_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) {
            throw "Repository secret WINDOWS_CERTIFICATE_PFX_BASE64 is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:QUICKCALC_CERT_PASSWORD)) {
            throw "Repository secret WINDOWS_CERTIFICATE_PASSWORD is missing."
          }
          $certificateDirectory = Join-Path $env:GITHUB_WORKSPACE "cert"
          New-Item -ItemType Directory -Force -Path $certificateDirectory | Out-Null
          $certificatePath = Join-Path $certificateDirectory "cert.pfx"
          try {
            $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          } catch {
            throw "WINDOWS_CERTIFICATE_PFX_BASE64 is not valid Base64."
          }
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUICKCALC_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QuickCalc ${{ github.ref_name }}
          releaseBody: |
            Windows x64 与 ARM64 安装包：
            - NSIS `.exe`：适合普通用户安装
            - MSI：适合企业部署或系统管理员

            应用主程序、NSIS 安装程序与 MSI 均使用项目的 Windows 证书进行 Authenticode 签名。
            当前使用自签名证书；未信任该证书的设备仍可能显示发布者或 SmartScreen 警告。

            * 特别说明：ARM64 版本未经实机验证，可能出现故障或问题。
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: false
          retryAttempts: 2
          releaseAssetNamePattern: QuickCalc_[version]_windows_${{ matrix.arch }}_[bundle].[ext]
          args: --ci --target ${{ matrix.target }} --bundles nsis,msi

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "cert\cert.pfx") -Force -ErrorAction SilentlyContinue

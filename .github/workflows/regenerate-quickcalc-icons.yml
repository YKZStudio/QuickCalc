name: Regenerate QuickCalc icons

on:
  push:
    branches:
      - fix/icon-operator-alignment
    paths:
      - .github/workflows/regenerate-quickcalc-icons.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Tauri icon assets
        run: npm run tauri -- icon src-tauri/icons/icon.svg

      - name: Commit generated icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/icons
          if git diff --cached --quiet; then
            echo "Icon assets are already up to date."
          else
            git commit -m "Regenerate Tauri icon assets"
            git push
          fi
